name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests with enforced coverage
        run: pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install "build>=1.2,<2" "twine>=7,<8"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Install and import from a clean wheel environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/pagetrace-wheel"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -c \
            "import pagetrace; print(pagetrace.__name__, pagetrace.__file__)"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace --help
