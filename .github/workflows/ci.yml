name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit frontend build dependencies
        run: npm audit --audit-level=high
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Verify packaged assets are current
        working-directory: .
        run: git diff --exit-code -- src/pagetrace/web/dist

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Update package installer
        run: python -m pip install --upgrade "pip==26.2.1"
      - name: Install project and development tools
        run: python -m pip install -e ".[dev,ocr,structure]"
      - name: Run tests with enforced coverage
        run: pytest
      - name: Audit installed Python dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit --local --skip-editable

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install "build>=1.2,<2" "twine>=7,<8"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Install and import from a clean wheel environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/pagetrace-wheel"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -c \
            "import pagetrace, pagetrace.backend, pagetrace.corpus, pagetrace.extraction, pagetrace.ocr, pagetrace.qa, pagetrace.quality, pagetrace.retrieval; print(pagetrace.__name__, pagetrace.__file__)"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" extract-text --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" ocr --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" inspect-ocr --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" evaluate-ocr --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" structure --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" inspect-structure --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" build-corpus --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" inspect-corpus --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" retrieve --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" evaluate-retrieval --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" answer --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" evaluate-quality --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace" portfolio-demo --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace-backend" --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/pagetrace-backend" purge --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -c \
            "from importlib import resources; assert resources.files('pagetrace.web').joinpath('dist/index.html').is_file()"
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace extract-text --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace ocr --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace structure --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace build-corpus --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace retrieve --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace answer --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace evaluate-quality --help
          "${RUNNER_TEMP}/pagetrace-wheel/bin/python" -I -m pagetrace portfolio-demo --help
