# Optional Blueprint for review only. Creating/syncing it deploys the site.
# Keep this in showcase/; select showcase/render.yaml in the Blueprint setup.
services:
  - type: web
    name: pagetrace-showcase
    runtime: static
    repo: https://github.com/HivMindAI/PageTrace
    branch: feature/pagetrace-render-demo
    rootDir: showcase
    buildCommand: node scripts/build.mjs
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
